[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend-engine"
version = "0.1.0"
description = "Production-Ready REST API built with FastAPI, SQLAlchemy 2.0, PostgreSQL, and Pydantic v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.6",
    "mypy>=1.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
